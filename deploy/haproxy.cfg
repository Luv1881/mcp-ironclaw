global
    log stdout format raw local0 info
    maxconn 200000
    nbthread 8
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-server-options ssl-min-ver TLSv1.3
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-buffer-request
    timeout connect 5s
    timeout client 65s
    timeout server 65s
    timeout http-request 15s
    timeout tunnel 1h
    default-server init-addr last,libc,none

resolvers platform
    parse-resolv-conf
    hold valid 10s
    hold obsolete 5s
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s

frontend device_ingress
    bind :443 ssl crt /etc/ironclaw/tls/edge.pem ca-file /etc/ironclaw/tls/ca.crt verify required crl-file /etc/ironclaw/tls/devices.crl alpn h2,http/1.1

    acl has_client_cert ssl_c_used
    acl cert_verified ssl_c_verify 0
    http-request deny deny_status 403 unless has_client_cert cert_verified

    # Delete before setting: set-header is skipped when the sample fetch yields
    # nothing (a certificate with no CN), which would otherwise let a client
    # supplied header survive to ingest. Deleting first fails closed instead.
    http-request del-header X-Device-Id
    http-request del-header X-Device-Serial
    http-request set-header X-Device-Id %{+Q}[ssl_c_s_dn(CN)]
    http-request set-header X-Device-Serial %{+Q}[ssl_c_serial,hex]

    # A certificate that yields no CN must never reach the backend unidentified.
    http-request deny deny_status 403 unless { req.hdr(X-Device-Id) -m found }
    http-request set-header X-Forwarded-Proto https
    http-request del-header X-Ingest-Trusted
    http-request set-header X-Ingest-Trusted edge

    stick-table type string len 64 size 1m expire 60s store http_req_rate(10s),conn_cur
    http-request track-sc0 ssl_c_s_dn(CN)
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 600 }

    default_backend ingest_pool

backend ingest_pool
    balance leastconn
    option httpchk GET /healthz
    http-check expect status 200

    default-server ssl verify required verifyhost ingest.ironclaw.internal ca-file /etc/ironclaw/tls/ca.crt crt /etc/ironclaw/tls/edge.pem check inter 3s fall 3 rise 2 maxconn 20000 resolvers platform init-addr last,libc,none on-marked-down shutdown-sessions

    server ingest-a ingest-a.ironclaw.internal:8443
    server ingest-b ingest-b.ironclaw.internal:8443
    server ingest-c ingest-c.ironclaw.internal:8443

frontend health
    bind :8080
    monitor-uri /haproxy-health
