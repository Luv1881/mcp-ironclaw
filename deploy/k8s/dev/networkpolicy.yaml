apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: ironclaw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingest
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aggregator
      ports:
        - protocol: TCP
          port: 6379
---
