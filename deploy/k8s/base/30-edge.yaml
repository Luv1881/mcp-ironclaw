apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: ironclaw
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: ironclaw
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
        app.kubernetes.io/part-of: ironclaw
    spec:
      serviceAccountName: ironclaw-edge
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        fsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: edge
      containers:
        - name: haproxy
          image: haproxy:3.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /haproxy-health
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /haproxy-health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
            - name: tls
              mountPath: /etc/ironclaw/tls
              readOnly: true
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: ironclaw-edge-config
        - name: tls
          secret:
            secretName: ironclaw-edge-tls
            defaultMode: 0440
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: ironclaw
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: ironclaw
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
  namespace: ironclaw
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge
  namespace: ironclaw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
