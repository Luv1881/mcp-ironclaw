apiVersion: v1
kind: Namespace
metadata:
  name: ironclaw
  labels:
    app.kubernetes.io/part-of: ironclaw
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ironclaw-ingest
  namespace: ironclaw
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/part-of: ironclaw
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ironclaw-aggregator
  namespace: ironclaw
  labels:
    app.kubernetes.io/name: aggregator
    app.kubernetes.io/part-of: ironclaw
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ironclaw-edge
  namespace: ironclaw
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: ironclaw
automountServiceAccountToken: false
